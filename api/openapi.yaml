openapi: 3.0.3
info:
  title: NFL Team Efficiency Dashboard API
  version: "1.0.0"
  description: >
    REST API serving team efficiency metrics (EPA/play, success rate,
    points/drive — offense, defense, and special teams), head-to-head
    comparisons, leaderboards, and game win-probability predictions,
    computed from nflverse play-by-play data.
servers:
  - url: http://localhost:3000
    description: Local development

paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /api/teams:
    get:
      summary: List all teams
      responses:
        "200":
          description: All 32 NFL teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"

  /api/teams/{abbreviation}/stats:
    get:
      summary: Weekly efficiency trend for one team
      parameters:
        - name: abbreviation
          in: path
          required: true
          schema:
            type: string
          example: KC
        - $ref: "#/components/parameters/Season"
      responses:
        "200":
          description: Team info plus one row per week played
          content:
            application/json:
              schema:
                type: object
                required: [team, season, weeks]
                properties:
                  team:
                    $ref: "#/components/schemas/Team"
                  season:
                    type: integer
                  weeks:
                    type: array
                    items:
                      $ref: "#/components/schemas/TeamWeekMetrics"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/compare:
    get:
      summary: Side-by-side weekly series and season averages for two teams
      parameters:
        - name: teamA
          in: query
          required: true
          schema:
            type: string
          example: KC
        - name: teamB
          in: query
          required: true
          schema:
            type: string
          example: BUF
        - $ref: "#/components/parameters/Season"
      responses:
        "200":
          description: Both teams' weekly series and season averages
          content:
            application/json:
              schema:
                type: object
                required: [season, teamA, teamB]
                properties:
                  season:
                    type: integer
                  teamA:
                    $ref: "#/components/schemas/TeamComparison"
                  teamB:
                    $ref: "#/components/schemas/TeamComparison"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/leaderboard:
    get:
      summary: Teams ranked by one efficiency metric
      parameters:
        - name: metric
          in: query
          schema:
            $ref: "#/components/schemas/MetricColumn"
          description: Defaults to epa_per_play
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 32
        - $ref: "#/components/parameters/Season"
      responses:
        "200":
          description: Teams ranked by the requested metric
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
        "400":
          description: Invalid metric name (whitelist-checked before use in SQL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/predictions:
    get:
      summary: Win probabilities for one week's games
      description: >
        Defaults to the earliest (season, week) with at least one game that
        hasn't been played yet.
      parameters:
        - $ref: "#/components/parameters/Season"
        - name: week
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Games for the resolved season/week, with predictions where available
          content:
            application/json:
              schema:
                type: object
                required: [season, week, games]
                properties:
                  season:
                    type: integer
                    nullable: true
                  week:
                    type: integer
                    nullable: true
                  games:
                    type: array
                    items:
                      $ref: "#/components/schemas/GamePrediction"

  /api/players:
    get:
      summary: Qualifying starters at one position, ranked by a metric
      description: >
        "Starter" is approximated by a minimum-volume cutoff (no snap-count
        data available) — see each position's metric definitions. Always
        returns every metric defined for the position in `values`, not just
        the one sorted on, so a future two-metric view needs no API change.
      parameters:
        - name: position
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PositionGroup"
        - name: metric
          in: query
          required: false
          schema:
            type: string
          description: Defaults to the position's first metric. Must be one of that position's own metrics.
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
            maximum: 100
        - $ref: "#/components/parameters/Season"
      responses:
        "200":
          description: Qualifying players at the position, with every metric for that position
          content:
            application/json:
              schema:
                type: object
                required: [position, season, metrics, players]
                properties:
                  position:
                    $ref: "#/components/schemas/PositionGroup"
                  season:
                    type: integer
                  metrics:
                    type: array
                    items:
                      type: string
                  players:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlayerMetricEntry"
        "400":
          description: Invalid position, or a metric not defined for that position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    Season:
      name: season
      in: query
      required: false
      schema:
        type: integer
      description: Defaults to the most recent season with data

  responses:
    NotFound:
      description: No team with that abbreviation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Missing or invalid query parameter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Team:
      type: object
      required: [id, name, abbreviation, conference, division, logo_url, color, color2]
      properties:
        id:
          type: integer
        name:
          type: string
        abbreviation:
          type: string
        conference:
          type: string
          nullable: true
        division:
          type: string
          nullable: true
        logo_url:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
          description: Primary team color, hex
        color2:
          type: string
          nullable: true
          description: Secondary team color, hex

    MetricColumn:
      type: string
      enum:
        - epa_per_play
        - success_rate
        - points_per_drive
        - epa_per_play_allowed
        - success_rate_allowed
        - points_per_drive_allowed
        - st_epa_per_play
        - st_epa_per_play_allowed

    TeamWeekMetrics:
      type: object
      required:
        - week
        - epa_per_play
        - success_rate
        - points_per_drive
        - epa_per_play_allowed
        - success_rate_allowed
        - points_per_drive_allowed
        - st_epa_per_play
        - st_epa_per_play_allowed
      properties:
        week:
          type: integer
        epa_per_play:
          type: number
          nullable: true
        success_rate:
          type: number
          nullable: true
        points_per_drive:
          type: number
          nullable: true
        epa_per_play_allowed:
          type: number
          nullable: true
        success_rate_allowed:
          type: number
          nullable: true
        points_per_drive_allowed:
          type: number
          nullable: true
        st_epa_per_play:
          type: number
          nullable: true
        st_epa_per_play_allowed:
          type: number
          nullable: true

    TeamComparison:
      type: object
      required: [team, weeks, averages]
      properties:
        team:
          $ref: "#/components/schemas/Team"
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/TeamWeekMetrics"
        averages:
          type: object
          description: Season-long average of each metric, keyed by MetricColumn
          additionalProperties:
            type: number
            nullable: true

    LeaderboardEntry:
      type: object
      required: [abbreviation, name, value, logo_url, color]
      properties:
        abbreviation:
          type: string
        name:
          type: string
        value:
          type: number
        logo_url:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
          description: Primary team color, hex

    GamePrediction:
      type: object
      required:
        - game_id
        - season
        - week
        - date
        - home_team
        - home_team_name
        - away_team
        - away_team_name
        - home_score
        - away_score
        - home_win_probability
      properties:
        game_id:
          type: string
        season:
          type: integer
        week:
          type: integer
        date:
          type: string
          format: date
        home_team:
          type: string
        home_team_name:
          type: string
        away_team:
          type: string
        away_team_name:
          type: string
        home_score:
          type: integer
          nullable: true
        away_score:
          type: integer
          nullable: true
        home_win_probability:
          type: number
          nullable: true

    PositionGroup:
      type: string
      enum: [QB, RB, WR, TE, EDGE, LB, CB, S]

    PlayerMetricEntry:
      type: object
      required: [player_id, name, headshot_url, volume, team_abbreviation, team_color, team_logo_url, values]
      properties:
        player_id:
          type: string
        name:
          type: string
        headshot_url:
          type: string
          nullable: true
        volume:
          type: number
          description: The stat this position's starter cutoff is measured on (e.g. attempts for QB, games for EDGE)
        team_abbreviation:
          type: string
        team_color:
          type: string
          nullable: true
        team_logo_url:
          type: string
          nullable: true
        values:
          type: object
          description: Every metric defined for this position, keyed by metric name
          additionalProperties:
            type: number
            nullable: true
