name: Weekly ingest + predict

on:
  schedule:
    # Tuesday 15:00 UTC — after Monday Night Football and nflverse's own
    # weekly data refresh.
    - cron: "0 15 * * 2"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to ingest"
        required: false
        default: "2026"

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  ingest-and-predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest latest results
        run: python ingest.py --season ${{ inputs.season || '2026' }}

      - name: Retrain and refresh predictions
        run: python predict.py
